const paths=[...document.querySelectorAll('.logo-progress')];
const lengths=paths.map(path=>path.getTotalLength());
let remaining=lengths.reduce((sum,length)=>sum+length,0)*.37;
paths.forEach((path,index)=>{path.style.strokeDashoffset=String(100*(1-Math.min(1,Math.max(0,remaining/lengths[index]))));remaining-=lengths[index];});
const scenes=[
{image:'life-city.jpg',alt:'Los Santos bei Nacht',category:'COMMUNITY',title:'Die Community wartet.',description:'Neu hier? Lerne die Community auf Discord kennen.',cta:'Mehr im Discord ↗'},
{image:'life-bar.jpg',alt:'Bar in Los Santos',category:'NACHTLEBEN',title:'Abends in Los Santos.',description:'Entdecke die Bars und Treffpunkte von Los Santos.',cta:'Entdecke das Nachtleben ↗'},
{image:'life-crew.jpg',alt:'Eine Crew in Los Santos',category:'COMMUNITY',title:'Finde deine Crew.',description:'Stellt eure Gruppe vor und findet neue Mitspieler.',cta:'Vernetzen im Discord ↗'},
{image:'faction-police.jpg',alt:'Polizeieinsatz in Los Santos',category:'FRAKTIONEN',title:'Einblicke in den Streifendienst.',description:'Lerne den Polizeialltag auf NEO V kennen.',cta:'Fraktionen kennenlernen ↗'}
];
let active=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,elapsed=0,lastFrame=performance.now();
const buttons=[...document.querySelectorAll('.scene-controls button')];
function schedule(){lastFrame=performance.now();}
function tick(now){if(!paused&&!document.hidden){elapsed+=now-lastFrame;if(elapsed>=8000)show(active+1);}lastFrame=now;document.querySelector('.scene-controls').style.setProperty('--cycle',String(elapsed/8000));requestAnimationFrame(tick);}
function show(index){const visual=document.querySelector('.visual');visual.classList.remove('is-changing');void visual.offsetWidth;visual.classList.add('is-changing');active=(index+scenes.length)%scenes.length;elapsed=0;document.querySelector('.scene-controls').style.setProperty('--cycle','0');const scene=scenes[active];document.querySelector('#scene').src='../../html/media/'+scene.image;document.querySelector('#scene').alt=scene.alt;document.querySelector('#category').textContent=scene.category;document.querySelector('#ad-title').innerHTML=scene.title;document.querySelector('#ad-description').textContent=scene.description;document.querySelector('#ad-link').textContent=scene.cta;document.querySelector('#counter').textContent=String(active+1).padStart(2,'0')+' / 04';buttons.forEach((button,i)=>{button.setAttribute('aria-pressed',String(i===active));button.setAttribute('aria-current',String(i===active));button.classList.toggle('is-complete',i<active);});schedule();}
function updatePause(){document.querySelector('#cycle-state').textContent=paused?'Pausiert':'Automatisch';const button=document.querySelector('#pause');button.textContent=paused?'▶':'Ⅱ';button.setAttribute('aria-pressed',String(paused));button.setAttribute('aria-label',paused?'Automatischen Wechsel fortsetzen':'Automatischen Wechsel pausieren');schedule();}
buttons.forEach((button,index)=>button.addEventListener('click',()=>show(index)));
document.querySelector('#previous').addEventListener('click',()=>show(active-1));document.querySelector('#next').addEventListener('click',()=>show(active+1));document.querySelector('#pause').addEventListener('click',()=>{paused=!paused;updatePause();});
document.querySelector('.advert').addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();show(active+(event.key==='ArrowRight'?1:-1));}});
document.addEventListener('visibilitychange',schedule);updatePause();requestAnimationFrame(tick);
</script>
