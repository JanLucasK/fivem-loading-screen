<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 114 117" role="img" aria-label="NeoV">
  <title>NeoV</title>
  <defs>
    <!-- Gebuerstetes Messing: heller Anschliff oben links, Kern-Gold, dunkler Abfall unten rechts. -->
    <linearGradient id="neovGold" x1="0.05" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#f2d78e"/>
      <stop offset="26%" stop-color="#cb9b30"/>
      <stop offset="50%" stop-color="#f7e5aa"/>
      <stop offset="76%" stop-color="#bd8c24"/>
      <stop offset="100%" stop-color="#8b6414"/>
    </linearGradient>
    <!-- Extrusionsflanke: fast schwarz mit einem Rest Goldton, damit die Tiefe warm bleibt. -->
    <linearGradient id="neovDepth" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#402e0a"/>
      <stop offset="100%" stop-color="#0a0803"/>
    </linearGradient>

    <!-- Silhouette einmal definiert, unten zweimal gezeichnet: versetzt als Tiefe, davor in Gold. -->
    <path id="neovMark"
          d="M 18.2 82.7 L 36.5 48.7 L 58.0 103.0 L 100.0 41.2 L 96.8 12.8
             L 70.8 24.9 L 61.2 55.1 L 39.4 0.0 L 0.0 72.9 Z"/>
  </defs>

  <use href="#neovMark" x="3.5" y="4.5" fill="url(#neovDepth)"/>
  <use href="#neovMark" fill="url(#neovGold)" stroke="#7a5710" stroke-width="0.6"/>
</svg>
