<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>NeoV - Ladebildschirm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background"></div>

    <div class="container">
        <!-- Original-Render der Marke, freigestellt (schwarzer Hintergrund ausgekeyt).
             Die Datei muss in der files{}-Tabelle stehen, sonst liefert der Client 404
             und die Marke fehlt kommentarlos. -->
        <img class="logo-mark" src="img/logo.png" alt="NeoV">
        <div class="tagline">Los Santos wartet auf dich</div>

        <div class="progress-wrap">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-label" id="progress-label">0%</div>
        </div>

        <div class="status" id="status-text">Wird initialisiert ...</div>
    </div>

    <div class="footer">NeoV Roleplay</div>

    <script src="js/script.js"></script>
</body>
</html>
