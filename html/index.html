<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>NeoV - Ladebildschirm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background"></div>

    <div class="container">
        <!-- NeoV-Bildmarke, bewusst inline statt als <img src="...">: der Loadscreen
             muesste eine externe Datei erst ueber das files{}-Manifest ausliefern, und
             genau daran scheitert die Marke sonst still (404, kein sichtbarer Fehler).
             Inline ist sie Teil des Dokuments und kann nicht fehlen. -->
        <svg class="logo-mark" viewBox="-1 -1 106 110" role="img" aria-label="NeoV">
            <title>NeoV</title>
            <defs>
                <!-- Gebuerstetes Messing: heller Anschliff oben links, dunkler Abfall unten rechts. -->
                <linearGradient id="neovGold" x1="0.05" y1="0" x2="0.85" y2="1">
                    <stop offset="0%" stop-color="#f2d78e"/>
                    <stop offset="26%" stop-color="#cb9b30"/>
                    <stop offset="50%" stop-color="#f7e5aa"/>
                    <stop offset="76%" stop-color="#bd8c24"/>
                    <stop offset="100%" stop-color="#8b6414"/>
                </linearGradient>
                <!-- Extrusionsflanke: fast schwarz mit einem Rest Goldton, damit die Tiefe warm bleibt. -->
                <linearGradient id="neovDepth" x1="0" y1="0" x2="0.6" y2="1">
                    <stop offset="0%" stop-color="#402e0a"/>
                    <stop offset="100%" stop-color="#0a0803"/>
                </linearGradient>
            </defs>
            <!-- Gleiche Silhouette zweimal: versetzt als Tiefe, davor in Gold. -->
            <path transform="translate(3.5 4.5)" fill="url(#neovDepth)"
                  d="M 18.2 82.7 L 36.5 48.7 L 58 103 L 100 41.2 L 96.8 12.8
                     L 70.8 24.9 L 61.2 55.1 L 39.4 0 L 0 72.9 Z"/>
            <path fill="url(#neovGold)" stroke="#7a5710" stroke-width="0.6"
                  d="M 18.2 82.7 L 36.5 48.7 L 58 103 L 100 41.2 L 96.8 12.8
                     L 70.8 24.9 L 61.2 55.1 L 39.4 0 L 0 72.9 Z"/>
        </svg>
        <div class="tagline">Los Santos wartet auf dich</div>

        <div class="progress-wrap">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-label" id="progress-label">0%</div>
        </div>

        <div class="status" id="status-text">Wird initialisiert ...</div>
    </div>

    <div class="footer">NeoV Roleplay</div>

    <script src="js/script.js"></script>
</body>
</html>
